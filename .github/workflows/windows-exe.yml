name: Windows uygulaması (.exe) oluştur

# Kot karelajı aracının Windows'ta kurulum gerektirmeden çalışan tek
# dosyalık sürümünü üretir ve "son-surum" etiketli sürüme ekler:
#   https://github.com/mahmuttari/PLANET-GEAR/releases/tag/son-surum
# Sürüm dosyaları herkese açık depoda giriş yapmadan indirilebilir ve
# süresi dolmaz. Aynı dosyalar çalışmanın "Artifacts" bölümüne de konur.

on:
  push:
    branches:
      - "**"
    paths:
      - "kot-karelaj/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: KotKarelaji.exe
    runs-on: windows-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testleri çalıştır
        working-directory: kot-karelaj
        run: python -m unittest discover -s testler -v

      - name: PyInstaller kur
        run: python -m pip install --upgrade pip pyinstaller

      - name: Uygulamayı paketle
        working-directory: kot-karelaj
        run: python -m PyInstaller paketle/kot-karelaj.spec --noconfirm --clean

      - name: Üretilen uygulamayı sına
        working-directory: kot-karelaj
        shell: pwsh
        run: |
          $exe = "dist\KotKarelaji-konsol.exe"
          $exeGui = "dist\KotKarelaji.exe"
          foreach ($d in @($exe, $exeGui)) {
            if (-not (Test-Path $d)) { throw "$d olusmadi" }
            Write-Host "$d : $([math]::Round((Get-Item $d).Length / 1MB, 2)) MB"
          }

          # Alt komutlar calisiyor mu?
          # Not: ciktiyi "| Select-Object -First N" ile kirpmayin; PowerShell
          # ust surece dur sinyali gonderir ve $LASTEXITCODE bozulur.
          $cikti = & $exe sistemler
          if ($LASTEXITCODE -ne 0) { throw "sistemler komutu basarisiz" }
          $cikti | Select-Object -First 3 | ForEach-Object { Write-Host $_ }
          if ($cikti.Count -lt 30) { throw "sistemler ciktisi beklenenden kisa" }
          if (-not ($cikti -match "ITRF96-TM30")) { throw "ITRF96-TM30 listelenmedi" }

          $cikti = & $exe donustur "40.7654,29.9408"
          if ($LASTEXITCODE -ne 0) { throw "donustur komutu basarisiz" }
          $cikti | ForEach-Object { Write-Host $_ }
          if (-not ($cikti -match "495\.001")) { throw "donusum sonucu beklenen degerde degil" }

          # Ornek alandan gercek uretim. Netcad duzenini uctan uca sinamak
          # icin bolu isaretli nokta numarasi ve nokta kodu da verilir.
          & $exe uret --alan ornekler\izmit-ornek-saha.kml --aralik 100 `
              --kaynak yerel --sym ornekler\ornek-sym.asc --dem-sistemi ITRF96-TM30 `
              --no-profil satir-sutun --no-ayirac / --kod KARELAJ `
              --bicim ncn,csv,dxf,kml,rapor -c "$env:RUNNER_TEMP\sinama" --ad sinama
          if ($LASTEXITCODE -ne 0) { throw "uret komutu basarisiz" }

          $ncn = "$env:RUNNER_TEMP\sinama\sinama.ncn"
          if (-not (Test-Path $ncn)) { throw "NCN dosyasi olusmadi" }
          $satirlar = Get-Content $ncn
          Write-Host "NCN satir sayisi: $($satirlar.Count)"
          Write-Host "Ilk satir: $($satirlar[0])"
          if ($satirlar.Count -lt 100) { throw "NCN dosyasi beklenenden kisa" }

          # Netcad duzeni:  1/13 494900.00 4515400.00 87.92 0 "KARELAJ" "" ""
          $desen = '^\d+/\d+ \d+\.\d{2} \d+\.\d{2} -?\d+\.\d{2} 0 "KARELAJ" "" ""$'
          $bozuk = $satirlar | Where-Object { $_ -notmatch $desen }
          if ($bozuk) { throw "NCN duzeni beklenen bicimde degil: $($bozuk[0])" }
          if ($satirlar[0].Split(" ").Count -ne 8) { throw "NCN alan sayisi 8 degil" }
          Write-Host "NCN duzeni Netcad bicimiyle uyumlu ($($satirlar.Count) satir)."

          # Konsollu surumde harita arayuzu aciliyor mu?
          $is = Start-Process -FilePath $exe -ArgumentList "arayuz","--kapi","8791","--tarayici-yok" -PassThru
          Start-Sleep -Seconds 6
          try {
            $yanit = Invoke-WebRequest -Uri "http://127.0.0.1:8791/" -UseBasicParsing -TimeoutSec 20
            if ($yanit.StatusCode -ne 200) { throw "Arayuz yanit vermedi" }
            Write-Host "Arayuz yaniti: HTTP $($yanit.StatusCode), $($yanit.Content.Length) bayt"
            $api = Invoke-WebRequest -Uri "http://127.0.0.1:8791/api/baslangic" -UseBasicParsing -TimeoutSec 20
            if ($api.StatusCode -ne 200) { throw "API yanit vermedi" }
          } finally {
            Stop-Process -Id $is.Id -Force -ErrorAction SilentlyContinue
          }

          # Penceresiz surum: konsolu yok, gunluge yazmali ve kapat ucuyla
          # duzgun kapanmali
          $isGui = Start-Process -FilePath $exeGui -ArgumentList "arayuz","--kapi","8793","--tarayici-yok" -PassThru
          Start-Sleep -Seconds 8
          try {
            $g = Invoke-RestMethod -Uri "http://127.0.0.1:8793/api/baslangic" -TimeoutSec 20
            if (-not $g.penceresiz) { throw "Penceresiz surum kendini konsollu sanıyor" }
            Write-Host "Penceresiz surum yanit verdi, penceresiz bayragi dogru."

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8793/api/yasam" -TimeoutSec 10 | Out-Null
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8793/api/kapat" -TimeoutSec 10 | Out-Null
            Start-Sleep -Seconds 5
            if (-not $isGui.HasExited) { throw "Kapat ucu calismadi, surec hala acik" }
            Write-Host "Kapat ucu calisti, surec duzgun kapandi."
          } finally {
            if (-not $isGui.HasExited) {
              Stop-Process -Id $isGui.Id -Force -ErrorAction SilentlyContinue
            }
          }

          # Penceresiz surum gunluk dosyasi yazmali
          $gunlukler = @(
            "$env:USERPROFILE\Documents\Kot Karelaji\kot-karelaji-gunluk.txt",
            "$env:USERPROFILE\Kot Karelaji\kot-karelaji-gunluk.txt"
          )
          $bulunan = $gunlukler | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bulunan) { throw "Penceresiz surum gunluk dosyasi yazmadi" }
          Write-Host "Gunluk dosyasi: $bulunan"
          Get-Content $bulunan -TotalCount 6 | ForEach-Object { Write-Host "  $_" }

          Write-Host "Tum sinamalar basarili."

      - name: Kullanım notunu ekle
        working-directory: kot-karelaj
        shell: pwsh
        run: |
          @"
          KOT KARELAJI - Windows uygulamasi
          =================================

          Bu klasorde iki dosya var:

          KotKarelaji.exe          <- gunluk kullanim icin bunu kullanin
            Cift tiklayin. Komut penceresi ACILMAZ; dogrudan tarayicida
            harita arayuzu gelir. Alani cizin, araligi secin, "Uret ve
            indir" dugmesine basin.
            Kapatmak icin arayuzdeki "Uygulamayi kapat" dugmesini kullanin.

          KotKarelaji-konsol.exe   <- komut satiri kullanimi icin
            Ayni programdir, ciktiyi komut penceresine yazar.
              KotKarelaji-konsol.exe uret --alan saha.kml --aralik 25
              KotKarelaji-konsol.exe --help

          Uretilen dosyalar: Belgeler\Kot Karelaji
          Gunluk kaydi      : Belgeler\Kot Karelaji\kot-karelaji-gunluk.txt

          Kurulum gerekmez, Python gerekmez. Dosyalari USB bellege kopyalayip
          baska bir bilgisayarda da calistirabilirsiniz.

          Ornek alan dosyalari ve ornek sayisal yukseklik modeli, depodaki
          kot-karelaj\ornekler klasorundedir.

          Ayrintili kullanim: kot-karelaj\README.md
          "@ | Out-File -FilePath "dist\OKUBENI.txt" -Encoding utf8

      - name: Uygulamayı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KotKarelaji-windows
          path: |
            kot-karelaj/dist/KotKarelaji.exe
            kot-karelaj/dist/KotKarelaji-konsol.exe
            kot-karelaj/dist/OKUBENI.txt
          retention-days: 90
          if-no-files-found: error

      - name: Sürümü yayımla (son-surum)
        if: github.event_name != 'pull_request'
        working-directory: kot-karelaj
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $etiket = "son-surum"
          $tarih = (Get-Date).ToUniversalTime().ToString("dd.MM.yyyy HH:mm")
          $kisaSha = $env:GITHUB_SHA.Substring(0, 7)
          $notlar = @"
          ## Kot Karelajı - en son derleme

          | | |
          |---|---|
          | Kaynak | ``$kisaSha`` (``$env:GITHUB_REF_NAME``) |
          | Derleme | $tarih UTC |

          **KotKarelaji.exe** - çift tıklayın, komut penceresi açılmaz, tarayıcıda harita arayüzü gelir.
          **KotKarelaji-konsol.exe** - komut satırından kullanım için aynı program.
          **OKUBENI.txt** - kısa kullanım notu.

          Kurulum ve Python gerekmez. Çıktılar ``Belgeler\Kot Karelaji`` klasörüne yazılır.

          Bu sürüm her gönderimde silinip yeniden oluşturulur; dosyalar daima en son derlemeyi yansıtır.
          "@

          # Eski sürümü ve etiketini kaldır (ilk çalıştırmada yoktur, hata bastırılır)
          gh release delete $etiket --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "Önceki sürüm yok, yenisi oluşturulacak." }
          $global:LASTEXITCODE = 0

          gh release create $etiket `
            dist\KotKarelaji.exe dist\KotKarelaji-konsol.exe dist\OKUBENI.txt `
            --title "Kot Karelajı (son sürüm)" `
            --notes $notlar `
            --prerelease `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Sürüm oluşturulamadı" }

          Write-Host "Sürüm yayımlandı:"
          Write-Host "  https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$etiket"
          Write-Host "  https://github.com/$env:GITHUB_REPOSITORY/releases/download/$etiket/KotKarelaji.exe"
