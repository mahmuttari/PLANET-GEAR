[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kot-karelaj"
version = "1.0.0"
description = "Seçilen alandan belirli aralıklarla kot karelajı üretir ve noktaları Netcad NCN biçiminde dışa aktarır."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["karelaj", "kot", "netcad", "ncn", "harita", "cbs", "gis", "dem", "altyapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Natural Language :: Turkish",
]
# Çekirdek işlevlerin hiçbir harici bağımlılığı yoktur.
dependencies = []

[project.optional-dependencies]
# Yalnızca geliştirme/çapraz doğrulama içindir; kullanım için gerekli değildir.
gelistirme = ["pyproj>=3.4", "rasterio>=1.3", "numpy>=1.21"]

[project.scripts]
karelaj = "karelaj.cli:main"

[tool.setuptools]
packages = ["karelaj", "karelaj.kaynaklar", "karelaj.yazicilar"]

[tool.setuptools.package-data]
karelaj = ["web/*.html"]
